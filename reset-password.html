<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Reset your Clarity password</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 420px;
    margin: 10vh auto 0;
    padding: 0 24px;
    color: #1a1a1a;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #17181c; }
    input { background: #24252b; color: #e8e8e8; border-color: #3a3b42; }
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  p { color: #666; line-height: 1.4; }
  @media (prefers-color-scheme: dark) { p { color: #9a9ba3; } }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 1rem 0 0.25rem; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.7rem;
    border: 1px solid #d0d0d5;
    border-radius: 6px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    margin-top: 1.25rem;
    padding: 0.7rem;
    border: none;
    border-radius: 6px;
    background: #1971c2;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 1rem; font-size: 0.9rem; }
  .status.error { color: #c92a2a; }
  .status.ok { color: #2b8a3e; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Reset your password</h1>
  <p id="intro">Choose a new password for your Clarity account. If Clarity is installed on this device, it should
    have opened automatically — you can close this tab.</p>

  <form id="form">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" />
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" />
    <button id="submit" type="submit">Set new password</button>
  </form>

  <div id="status" class="status hidden"></div>

<script>
(function () {
  // GoTrue redirects here as `<this page>?project_url=...&anon=...#access_token=...&refresh_token=...&type=recovery`
  // -- the query params are ones this app added itself when it called
  // /auth/v1/recover with `redirect_to`, so the fragment GoTrue appends
  // survives after them. See supabase_request_password_reset (src-tauri) and
  // requestPasswordReset (supabaseSlice.ts).
  var query = new URLSearchParams(location.search);
  var fragment = new URLSearchParams(location.hash.replace(/^#/, ""));

  var projectUrl = query.get("project_url");
  var anonKey = query.get("anon");
  var accessToken = fragment.get("access_token");
  var refreshToken = fragment.get("refresh_token");

  var form = document.getElementById("form");
  var statusEl = document.getElementById("status");
  var submitBtn = document.getElementById("submit");
  var intro = document.getElementById("intro");

  function showStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = "status " + kind;
  }

  if (!projectUrl || !anonKey || !accessToken || !refreshToken) {
    form.classList.add("hidden");
    intro.classList.add("hidden");
    showStatus("This reset link is invalid or has expired. Request a new one from Clarity's sign-in screen.", "error");
    return;
  }

  // Best-effort handoff to the desktop/mobile app if it's installed on this
  // device and registers the clarity:// scheme; a no-op if not (the browser
  // just stays on this page, which still works standalone below).
  try {
    window.location.href = "clarity://reset-password" + location.hash;
  } catch (e) {
    // Custom-scheme navigation can throw in some browsers; ignore either way.
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;

    if (password.length < 6) {
      showStatus("Password must be at least 6 characters.", "error");
      return;
    }
    if (password !== confirm) {
      showStatus("Passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    showStatus("Saving…", "");

    fetch(projectUrl.replace(/\/+$/, "") + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        apikey: anonKey,
        Authorization: "Bearer " + accessToken,
      },
      body: JSON.stringify({ password: password }),
    })
      .then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (body) {
          if (!resp.ok) {
            throw new Error(body.error_description || body.msg || "Couldn't set the new password.");
          }
        });
      })
      .then(function () {
        form.classList.add("hidden");
        showStatus("Your password has been reset. Return to Clarity and sign in.", "ok");
      })
      .catch(function (err) {
        showStatus(err.message, "error");
      })
      .finally(function () {
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
